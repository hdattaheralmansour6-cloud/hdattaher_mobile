{% extends "public/base.html" %}
{% block title %}Mes Favoris - HDATTAHER MOBILE{% endblock %}

{% block content %}
<div class="shop">
    <div class="shop-head">
        <h1 data-i18n="favorites_title">Mes Favoris</h1>
        <p id="favCountText"></p>
    </div>

    <div class="pc-grid" id="favoritesGrid" style="display:none;"></div>

    <div class="empty" id="favoritesEmpty" style="display:none;">
        <span class="empty-ic"><i class="fas fa-heart"></i></span>
        <h3 data-i18n="favorites_empty">Aucun favori pour le moment.</h3>
        <p data-i18n="favorites_hint">Touchez le cœur d'un produit pour le retrouver ici.</p>
        <a href="{{ url_for('products') }}" class="btn btn-primary" data-i18n="discover_products">Découvrir nos produits</a>
    </div>
</div>
{% endblock %}
