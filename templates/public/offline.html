<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0D">
<title>Pas de connexion · HDATTAHER MOBILE</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
       background: radial-gradient(120% 70% at 50% -10%, rgba(212, 175, 55, .16), transparent 60%), #0b0b0d;
       color: #F5F1E6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; text-align: center; }
.box { width: 100%; max-width: 420px; }
.logo { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 10px 30px rgba(212, 175, 55, .25); }
.brand { margin-top: 12px; font-weight: 800; letter-spacing: .18em; font-size: .78rem; color: #D4AF37; }
.ic { margin: 30px auto 6px; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
      border: 1.5px solid rgba(212, 175, 55, .45); background: rgba(212, 175, 55, .07); }
.ic svg { width: 34px; height: 34px; color: #E8C86E; }
h1 { font-size: 1.35rem; margin-top: 14px; }
p { margin-top: 10px; color: #B9B3A5; line-height: 1.55; font-size: .95rem; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin-top: 26px; border-radius: 14px; border: none;
       font: inherit; font-weight: 700; font-size: 1rem; color: #17120a; cursor: pointer;
       background: linear-gradient(135deg, #F1D88A, #C9A23F 55%, #A87C22); box-shadow: 0 10px 24px rgba(212, 175, 55, .25); }
small { display: block; margin-top: 14px; color: #8C8678; font-size: .8rem; }
[dir=rtl] .brand { letter-spacing: 0; }
</style>
</head>
<body>
<main class="box">
    <img class="logo" src="{{ logo }}" alt="HDATTAHER MOBILE" width="76" height="76">
    <div class="brand">HDATTAHER MOBILE</div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/><path d="M3 3l18 18"/></svg></div>
    <h1 data-t="t">Pas de connexion internet</h1>
    <p data-t="d">Vérifiez votre connexion (données mobiles ou Wi-Fi), puis réessayez. Vos articles restent dans votre panier.</p>
    <button type="button" class="btn" onclick="location.reload()" data-t="b">Réessayer</button>
    <small data-t="s">La page s'ouvrira toute seule dès que la connexion revient.</small>
</main>
<script>
(function () {
    var T = {
        en: { t: 'No internet connection', d: 'Check your connection (mobile data or Wi-Fi), then try again. Your items stay in your cart.', b: 'Try again', s: 'The page will open by itself as soon as the connection is back.' },
        ar: { t: 'لا يوجد اتصال بالإنترنت', d: 'تحقق من اتصالك (بيانات الهاتف أو الواي فاي) ثم حاول مرة أخرى. منتجاتك تبقى في سلة التسوق.', b: 'حاول مرة أخرى', s: 'ستفتح الصفحة تلقائيًا عند عودة الاتصال.' }
    };
    var lang = 'fr';
    try { lang = localStorage.getItem('lang') || 'fr'; } catch (e) {}
    var t = T[lang];
    if (t) {
        document.documentElement.lang = lang;
        if (lang === 'ar') document.documentElement.dir = 'rtl';
        document.querySelectorAll('[data-t]').forEach(function (el) { if (t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
    }
    window.addEventListener('online', function () { location.reload(); });
})();
</script>
</body>
</html>
