# Garde le site et Supabase actifs : visite /ping/db tous les 3 jours.
# (Supabase gratuit se met en pause après 7 jours sans activité.)
# Si Supabase ne répond pas, la tâche échoue et GitHub vous prévient par e-mail.
name: Garder Supabase actif

on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours vers 7 h (heure du Niger)
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiter le site (réveille Render puis lit Supabase)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" --max-time 90 "https://hdattahermobile.com/ping/db" || echo 000)
            echo "Essai $i : HTTP $code - $(cat /tmp/r.txt 2>/dev/null)"
            if [ "$code" = "200" ]; then echo "Supabase est actif ✅"; exit 0; fi
            sleep 30
          done
          echo "::error::Le site ou Supabase ne répond pas. Ouvrez supabase.com et touchez « Resume project » si le projet est en pause."
          exit 1
