# Vérification temporaire : pourquoi Chrome (Android) propose-t-il ou non l'installation ?
name: Diagnostic installation
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fichiers servis par le site
        run: |
          for u in /manifest-admin.webmanifest /manifest.webmanifest /sw.js /static/pwa/icon-192.png /static/pwa/icon-512.png /static/pwa/maskable-512.png; do
            echo "== $u"; curl -s -o /tmp/f -D /tmp/h --max-time 90 "https://hdattahermobile.com$u"; grep -i "^HTTP\|^content-type\|^cache-control\|^server\|^cf-" /tmp/h; head -c 400 /tmp/f | tr -d '\0' | head -c 400; echo; done
          echo "== /azawad (head)"; curl -s --max-time 60 https://hdattahermobile.com/azawad | sed -n '1,40p'
      - name: Chrome Android
        run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > c.js <<'JS'
          const p = require('puppeteer-core');
          (async () => {
            const b = await p.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            for (const path of ['/', '/azawad']) {
              const pg = await b.newPage();
              await pg.emulate(p.KnownDevices['Pixel 5']);
              const logs = []; pg.on('console', m => logs.push(m.text())); pg.on('pageerror', e => logs.push('ERR ' + e.message));
              await pg.evaluateOnNewDocument(() => { window.addEventListener('beforeinstallprompt', () => { window.__got = true; }); });
              await pg.goto('https://hdattahermobile.com' + path, { waitUntil: 'networkidle2', timeout: 90000 });
              await new Promise(r => setTimeout(r, 6000));
              const c = await pg.target().createCDPSession();
              const inst = await c.send('Page.getInstallabilityErrors');
              const man = await c.send('Page.getAppManifest');
              console.log('\n#### PAGE', path, '->', pg.url());
              console.log('manifest:', man.url, 'erreurs manifest:', JSON.stringify(man.errors));
              console.log('INSTALLABILITE:', JSON.stringify(inst.installabilityErrors));
              console.log('service worker:', await pg.evaluate(async () => { const r = await navigator.serviceWorker.getRegistration(); return r ? (r.active ? 'actif' : 'pas actif') : 'aucun'; }));
              console.log('beforeinstallprompt reçu:', await pg.evaluate(() => !!window.__got), '| __hmBip:', await pg.evaluate(() => typeof window.__hmBip));
              console.log('console:', logs.slice(0, 10).join(' | '));
            }
            await b.close();
          })();
          JS
          node c.js
